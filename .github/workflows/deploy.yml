name: Deploy Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Criar backup da aplicacao atual
        run: |
          ssh -i ~/.ssh/oracle.key \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            '
            mkdir -p /home/ubuntu/backups
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)

            if [ -d /home/ubuntu/hello-web ]; then
              cp -r /home/ubuntu/hello-web \
                /home/ubuntu/backups/hello-web-$TIMESTAMP
            fi
            '

      - name: Enviar nova aplicacao
        run: |
          scp -i ~/.ssh/oracle.key \
            app.py requirements.txt \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/ubuntu/hello-web/"

      - name: Atualizar dependencias e reiniciar aplicacao
        run: |
          ssh -i ~/.ssh/oracle.key \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            '
            cd /home/ubuntu/hello-web
            source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart hello-web
            sleep 3
            curl --fail --max-time 10 http://127.0.0.1:5000
            '

      - name: Discord - sucesso
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MESSAGE: "✅ Deploy realizado com sucesso no Oracle Cloud! Commit: ${{ github.sha }}"
        run: |
          PAYLOAD=$(python3 -c 'import json, os; print(json.dumps({"content": os.environ["MESSAGE"]}))')

          curl -fsS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"

      - name: Discord - erro
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MESSAGE: "❌ Erro durante o deploy da aplicacao no Oracle Cloud. Commit: ${{ github.sha }}"
        run: |
          PAYLOAD=$(python3 -c 'import json, os; print(json.dumps({"content": os.environ["MESSAGE"]}))')

          curl -fsS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"